# Entorno del proyecto C1 (glaciaretes Maipo alto)
# Crear con:  conda env create -f environment.yml  &&  conda activate glaciaretes
name: glaciaretes
channels:
  - conda-forge
dependencies:
  - python=3.11
  - geopandas>=0.14
  - pyogrio
  - rasterio>=1.3
  - shapely>=2.0
  - pyproj
  - numpy
  - pandas
  - xarray
  - dask
  - matplotlib
  - pytest
  - pystac-client
  - planetary-computer
  - odc-stac
  - earthengine-api
